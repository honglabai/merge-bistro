      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#1e293b" flood-opacity="0.35"/>
    </filter>
    
  <radialGradient id="blueberryGrad" cx="35%" cy="30%" r="65%">
    <stop offset="0%" stop-color="#818cf8"/>
    <stop offset="50%" stop-color="#4338ca"/>
